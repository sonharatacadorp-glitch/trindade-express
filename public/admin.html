<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trindade Express — Administração</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#111827}header{background:#111827;color:#fff;padding:22px;text-align:center}header b{color:#ffd400;font-size:25px}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;padding:22px;border-radius:16px;margin-bottom:18px;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f8fafc;border-radius:12px;padding:16px}.stat b{display:block;font-size:25px;margin-top:5px}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px;font-size:15px}button{padding:12px 16px;border:0;border-radius:9px;background:#ffd400;font-weight:800;cursor:pointer}.dark{background:#111827;color:#fff}.danger{background:#fee2e2;color:#991b1b}.error{color:#b91c1c;font-weight:bold}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}th{font-size:13px}small{color:#6b7280}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.hidden{display:none!important}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><b>TRINDADE EXPRESS</b><br>Painel Administrativo</header><main>
<section id="login" class="card" style="max-width:520px;margin:24px auto"><h2>Acesso administrativo</h2><label>E-mail</label><input id="email" type="email" placeholder="admin@trindadeexpress.com.br"><br><br><label>Senha</label><input id="senha" type="password"><br><br><button style="width:100%" onclick="login()">ENTRAR NO PAINEL</button><p id="err" class="error"></p></section>
<section id="panel" class="hidden"><div class="top card"><div><h2 style="margin:0">Pedidos da Trindade Express</h2><small>Gerencie os pedidos e atualize o status das entregas.</small></div><button class="dark" onclick="logout()">SAIR</button></div>
<div class="grid" id="stats"></div>
<section class="card"><div class="top"><h2>Pedidos</h2><button onclick="carregar()">ATUALIZAR</button></div><p id="msg"></p><div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Rota</th><th>Valor</th><th>Criado</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div></section></section>
</main><script>
const $=id=>document.getElementById(id); const brl=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const statuses=["Aguardando pagamento","Pagamento aprovado","Coleta agendada","Coletado","Em trânsito","Entregue","Cancelado"];
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro');return d;}
async function login(){ $('err').textContent='';try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('email').value,senha:$('senha').value})});show();}catch(e){$('err').textContent=e.message;}}
async function show(){ $('login').classList.add('hidden');$('panel').classList.remove('hidden');await carregar();}
async function carregar(){try{const [o,s]=await Promise.all([api('/api/admin/orders'),api('/api/admin/stats')]);$('stats').innerHTML=`<div class="stat">Pedidos<strong>${s.totalPedidos}</strong></div><div class="stat">Valor total<strong>${brl(s.valorTotal)}</strong></div><div class="stat">Entregues<strong>${s.entregues}</strong></div><div class="stat">Pendentes<strong>${s.pendentes}</strong></div>`;$('tbody').innerHTML=o.orders.map(x=>`<tr><td><strong>${x.numero}</strong><br><small>${x.servico}</small></td><td>${x.cliente.nome}<br><small>${x.cliente.email}<br>${x.cliente.whatsapp}</small></td><td>${x.origem.cidade}/${x.origem.uf}<br>→ ${x.destino.cidade}/${x.destino.uf}</td><td><strong>${brl(x.total)}</strong><br><small>${x.distanciaCobradaKm} km</small></td><td>${new Date(x.criadoEm).toLocaleString('pt-BR')}</td><td><select onchange="mudarStatus('${x.id}',this.value)">${statuses.map(st=>`<option ${st===x.status?'selected':''}>${st}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="6">Nenhum pedido.</td></tr>';}catch(e){$('msg').textContent=e.message;}}
async function mudarStatus(id,status){try{await api('/api/admin/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});await carregar();}catch(e){alert(e.message);}}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload();}
(async()=>{try{const d=await api('/api/admin/me');if(d.authenticated)show();}catch{}})();
</script></body></html>
